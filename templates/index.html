<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCA Signal Monitor</title>
    <!-- Modern Tech Font Option -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --table-bg: #0a0a0a;
            --border-color: #1e1e1e;
            --hover-bg: #111111;
            --text-primary: #e5e5e5;
            --text-secondary: #737373;
            --green: #00ff00;
            --red: #ff0000;
            --orange: #ffb800;
            --gray: #3f3f46;
            --blue: #3b82f6;
        }

        body {
            margin: 0;
            padding: 1rem;
            background: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
        }



        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto 1rem auto;
            flex-wrap: wrap;
            gap: 1rem;
            background: var(--table-bg);
            padding: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }

        .header-buttons {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .header-stats {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
        }

        .pnl-pill {
            background: transparent;
            border-right: 1px solid var(--border-color);
            padding: 0 1rem;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Roboto Mono', monospace;
        }
        .pnl-pill:last-child {
            border-right: none;
        }

        @media (max-width: 768px) {
            .header-container {
                flex-direction: column;
                align-items: flex-start;
            }
            .header-stats {
                width: 100%;
                justify-content: space-between;
                gap: 0.5rem;
            }
            .pnl-pill {
                border-right: none;
                padding: 0.5rem 0;
                width: 100%;
                border-bottom: 1px solid var(--border-color);
            }
            .pnl-pill:last-child {
                border-bottom: none;
            }
            .header-buttons {
                width: 100%;
                justify-content: space-between;
            }
            .btn-toggle, .btn-close-all {
                flex: 1;
                text-align: center;
            }
        }

        .btn-close {
            background-color: transparent;
            color: var(--red);
            border: 1px solid var(--red);
            padding: 0.25rem 0.6rem;
            border-radius: 2px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.1s;
            text-transform: uppercase;
        }
        .btn-close:hover {
            background-color: var(--red);
            color: #000;
        }

        .btn-close-all {
            background-color: transparent;
            color: var(--red);
            border: 1px solid var(--red);
            padding: 0.4rem 1rem;
            border-radius: 2px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.1s;
            text-transform: uppercase;
        }
        .btn-close-all:hover {
            background-color: var(--red);
            color: #000;
        }

        .btn-toggle {
            background-color: transparent;
            color: var(--green);
            border: 1px solid var(--green);
            padding: 0.4rem 1rem;
            border-radius: 2px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.1s;
            text-transform: uppercase;
        }
        .btn-toggle.off {
            color: var(--gray);
            border: 1px solid var(--gray);
        }
        .btn-toggle:hover {
            background-color: var(--green);
            color: #000;
        }
        .btn-toggle.off:hover {
            background-color: var(--gray);
            color: #fff;
        }

        .table-container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--table-bg);
            border: 1px solid var(--border-color);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            min-width: 800px; 
            font-size: 0.85rem;
        }

        th, td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background: #000000;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            font-weight: 600;
            white-space: nowrap;
            border-bottom: 2px solid var(--border-color);
        }

        tr {
            transition: all 0.2s ease;
        }

        tr:hover {
            background: var(--hover-bg);
        }

        tr:last-child td {
            border-bottom: none;
        }

        .mono {
            font-family: 'Roboto Mono', monospace;
            letter-spacing: -0.05em;
        }

        /* Symbol Name styling */
        .symbol-col {
            font-weight: 700;
            font-size: 0.95rem;
            white-space: nowrap;
        }

        /* Color Dot next to symbol */
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 0.75rem;
        }
        tr[data-color="green"] .dot { background: var(--green); box-shadow: 0 0 8px var(--green); }
        tr[data-color="red"] .dot { background: var(--red); }
        tr[data-color="orange"] .dot { background: var(--orange); }
        tr[data-color="gray"] .dot { background: var(--gray); }

        /* Badge Styling */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }

        tr[data-color="green"] .badge { background: rgba(16, 185, 129, 0.15); color: #34d399; }
        tr[data-color="red"] .badge { background: rgba(239, 68, 68, 0.15); color: #f87171; }
        tr[data-color="orange"] .badge { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
        tr[data-color="gray"] .badge { background: rgba(100, 116, 139, 0.15); color: #94a3b8; }

        .time-col {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-variant-numeric: tabular-nums;
        }

        .status-col {
            font-size: 0.95rem;
            color: #e2e8f0;
            line-height: 1.4;
        }

        /* Smooth pulse animation for active scanning */
        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
        .scanning { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

        @media (max-width: 768px) {
            th, td { padding: 0.75rem 1rem; }
            .status-col { 
                font-size: 0.85rem; 
                min-width: 250px; 
                white-space: normal;
            }
            .header-container { flex-direction: column; align-items: stretch; text-align: center; }
            .header-right { justify-content: center; width: 100%; }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <div class="header-buttons">
            <button id="btn-toggle" class="btn-toggle" onclick="toggleBot()">BOT: ON</button>
            <button class="btn-close-all" onclick="closeAll()">Close All</button>
            <button id="btn-session" class="btn-toggle" onclick="openSessionModal()" style="background-color: #3b82f6;">Start Session</button>
        </div>
        <div class="header-stats">
            <div class="pnl-pill" id="session-stats" style="font-size: 0.95rem; color: var(--text-secondary);">
                Session Inactive
            </div>
            <div class="pnl-pill" id="total-pnl">Total P/L: $0.00</div>
            <div class="pnl-pill" id="account-bal" style="color: var(--text-secondary);">Bal: $0.00</div>
        </div>
    </div>

    <!-- Session Modal -->
    <div id="session-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; justify-content:center; align-items:center;">
        <div style="background:#1e293b; padding:2rem; border-radius:12px; width:300px; box-shadow:0 10px 25px rgba(0,0,0,0.5);">
            <h3 style="margin-top:0; color:#fff;">Start New Session</h3>
            <div style="margin-bottom:1rem;">
                <label style="color:#cbd5e1; font-size:0.9rem; display:block; margin-bottom:0.5rem;">Target Profit ($)</label>
                <input type="number" id="inp-tp" style="width:100%; padding:0.5rem; border-radius:6px; border:1px solid #334155; background:#0f172a; color:#fff;" value="100.00">
            </div>
            <div style="margin-bottom:1rem;">
                <label style="color:#cbd5e1; font-size:0.9rem; display:block; margin-bottom:0.5rem;">Stop Loss ($)</label>
                <input type="number" id="inp-sl" style="width:100%; padding:0.5rem; border-radius:6px; border:1px solid #334155; background:#0f172a; color:#fff;" value="50.00">
            </div>
            <div style="margin-bottom:1.5rem;">
                <label style="color:#cbd5e1; font-size:0.9rem; display:block; margin-bottom:0.5rem;">Max Open Pairs</label>
                <input type="number" id="inp-max-sym" style="width:100%; padding:0.5rem; border-radius:6px; border:1px solid #334155; background:#0f172a; color:#fff;" value="2" min="1" max="10">
            </div>
            <div style="margin-bottom:1.5rem;">
                <label style="color:#cbd5e1; font-size:0.9rem; display:block; margin-bottom:0.5rem;">Trading Pairs</label>
                <div id="sym-checkboxes" style="display:grid; grid-template-columns:1fr 1fr; gap:0.5rem; max-height:150px; overflow-y:auto; background:#0f172a; padding:0.5rem; border:1px solid #334155; border-radius:6px;">
                    <!-- Checkboxes injected via JS -->
                </div>
            </div>
            <div style="display:flex; gap:1rem;">
                <button onclick="closeSessionModal()" style="flex:1; padding:0.5rem; background:#334155; color:#fff; border:none; border-radius:6px; cursor:pointer;">Cancel</button>
                <button onclick="submitSession()" style="flex:1; padding:0.5rem; background:#3b82f6; color:#fff; border:none; border-radius:6px; cursor:pointer; font-weight:bold;">Start</button>
            </div>
        </div>
    </div>
    
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Symbol</th>
                    <th>State</th>
                    <th>Details</th>
                    <th>PnL</th>
                    <th>Entry Time</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="dashboard">
                <!-- Rows injected here -->
            </tbody>
        </table>
    </div>

    <script>
        let isBotActive = true;
        let isSessionActive = false;
        let globalMasterSymbols = [];
        let globalSessionSymbols = [];

        async function fetchSignals() {
            try {
                const res = await fetch('/api/signals');
                const apiData = await res.json();
                
                if (apiData.master_symbols) {
                    globalMasterSymbols = apiData.master_symbols;
                }
                if (apiData.session_symbols) {
                    globalSessionSymbols = apiData.session_symbols;
                }

                renderDashboard(apiData);
            } catch (err) {
                console.error("Failed to fetch signals", err);
            }
        }

        function renderDashboard(apiData) {
            const tbody = document.getElementById('dashboard');
            const data = apiData.signals || {};
            const pnl = apiData.total_pnl || 0;

            isBotActive = apiData.is_active !== false;
            const toggleBtn = document.getElementById('btn-toggle');
            if (isBotActive) {
                toggleBtn.innerText = "BOT: ON";
                toggleBtn.className = "btn-toggle";
            } else {
                toggleBtn.innerText = "BOT: OFF";
                toggleBtn.className = "btn-toggle off";
            }

            const pnlEl = document.getElementById('total-pnl');
            const isProfit = pnl >= 0;
            pnlEl.innerHTML = `Running PnL: <span style="color: ${isProfit ? 'var(--green)' : 'var(--red)'}">${isProfit ? '+' : ''}$${pnl.toFixed(2)}</span>`;
            
            const balEl = document.getElementById('account-bal');
            const bal = apiData.balance || 0;
            if (balEl) balEl.innerHTML = `Bal: <span style="color:#fff">$${bal.toFixed(2)}</span>`;

            isSessionActive = apiData.session_active;
            const sessionBtn = document.getElementById('btn-session');
            const sessionStats = document.getElementById('session-stats');

            if (isSessionActive) {
                sessionBtn.innerText = "End Session";
                sessionBtn.style.backgroundColor = "#dc2626"; // red
                sessionBtn.onclick = endSession;

                const sPnl = apiData.session_pnl || 0;
                const sMax = apiData.session_max_symbols || 2;
                const sign = sPnl >= 0 ? '+' : '';
                const color = sPnl >= 0 ? 'var(--green)' : 'var(--red)';
                
                sessionStats.innerHTML = `Session PnL: <span style="color:${color}; font-weight:600;">${sign}$${sPnl.toFixed(2)}</span> &nbsp;|&nbsp; TP: $${apiData.session_tp} / SL: -$${apiData.session_sl} &nbsp;|&nbsp; Max: ${sMax}`;
            } else {
                sessionBtn.innerText = "Start Session";
                sessionBtn.style.backgroundColor = "#3b82f6"; // blue
                sessionBtn.onclick = openSessionModal;
                sessionStats.innerHTML = "Session Inactive";
            }
            
            // Build final array of symbols to display:
            // 1. If NO session is active, maybe show all master? (user wants them hidden but active trades might be open?)
            // We'll trust whatever signal_state tracking passed us in `data` (since backend wiped the old ones!)
            let symbols = Object.keys(data);
            
            // Further filter if session is active to ensure UI is perfectly clean
            if (apiData.session_active && globalSessionSymbols.length > 0) {
                symbols = symbols.filter(sym => globalSessionSymbols.includes(sym));
            }
            symbols.sort((a, b) => {
                const infoA = data[a];
                const infoB = data[b];
                const isAHolding = infoA.status.includes('Holding');
                const isBHolding = infoB.status.includes('Holding');
                
                if (isAHolding && !isBHolding) return -1;
                if (!isAHolding && isBHolding) return 1;
                
                return a.localeCompare(b);
            });
            
            if (symbols.length === 0) {
                tbody.innerHTML = '<tr id="waiting-row"><td colspan="6" style="text-align: center; color: var(--text-secondary); padding: 3rem;">Waiting for signal engine...</td></tr>';
                return;
            }

            // Remove waiting row if data arrives
            const wRow = document.getElementById('waiting-row');
            if (wRow) wRow.remove();

            symbols.forEach(sym => {
                const info = data[sym];
                let stateLabel = "Scanning";
                if (info.status.includes("Holding")) {
                    stateLabel = info.color === "green" ? "Profit" : "Drawdown";
                } else if (info.color === "green") {
                    stateLabel = "Active";
                } else if (info.color === "red") {
                    stateLabel = "Blocked";
                } else if (info.color === "orange") {
                    stateLabel = "Delayed";
                }

                let formattedTime = '--:--:--';
                if (info.time) {
                    const d = new Date(info.time * 1000);
                    formattedTime = d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                }

                let pnlText = "--";
                if (info.pnl !== undefined && info.status.includes("Holding")) {
                    const sign = info.pnl >= 0 ? '+' : '';
                    const color = info.pnl >= 0 ? 'var(--green)' : 'var(--red)';
                    pnlText = `<span class="mono" style="color: ${color}; font-weight: 600;">${sign}$${info.pnl.toFixed(2)}</span>`;
                }

                let row = document.getElementById('row-' + sym);
                
                if (!row) {
                    row = document.createElement('tr');
                    row.id = 'row-' + sym;
                    tbody.appendChild(row);
                }

                row.setAttribute('data-color', info.color);
                
                row.innerHTML = `
                    <td class="symbol-col">
                        <span class="dot" style="background-color: ${info.color === 'green' ? 'var(--green)' : (info.color === 'red' ? 'var(--red)' : (info.color === 'orange' ? 'var(--orange)' : 'var(--gray)'))}"></span>
                        ${sym}
                    </td>
                    <td>
                        <span class="badge ${info.color === 'gray' ? 'scanning' : ''}">${stateLabel}</span>
                    </td>
                    <td class="status-col mono" style="color: #a1a1aa;">${info.status}</td>
                    <td style="white-space: nowrap;">${pnlText}</td>
                    <td class="time-col mono" style="color: #71717a;">${info.time ? formattedTime : '--:--:--'}</td>
                    <td>
                        ${info.status.includes('Holding') ? `<button class="btn-close" onclick="closeSymbol('${sym}')">Close</button>` : ''}
                    </td>
                `;
            });
        }

        async function closeSymbol(sym) {
            if (!confirm(`Are you sure you want to CLOSE ALL ACTIVE TRADES for ${sym}?`)) return;
            try {
                await fetch(`/api/close/${sym}`, { method: 'POST' });
            } catch (err) {
                console.error(err);
            }
        }

        async function closeAll() {
            if (!confirm(`🚨 WARNING: Are you sure you want to PANIC CLOSE ALL trades?`)) return;
            try {
                await fetch(`/api/close_all`, { method: 'POST' });
            } catch (err) {
                console.error(err);
            }
        }

        async function toggleBot() {
            const newState = !isBotActive;
            const msg = newState ? "Turn the Bot ON? (Will start taking new entries)" : "Turn the Bot OFF? (Will pause taking new entries, but keep tracking open trades)";
            if (!confirm(msg)) return;
            try {
                await fetch(`/api/toggle`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ is_active: newState })
                });
                fetchSignals();
            } catch (err) {
                console.error(err);
            }
        }

        function openSessionModal() {
            const container = document.getElementById('sym-checkboxes');
            container.innerHTML = "";
            
            globalMasterSymbols.forEach(sym => {
                const label = document.createElement('label');
                label.style.display = 'flex';
                label.style.alignItems = 'center';
                label.style.gap = '0.5rem';
                label.style.color = '#fff';
                label.style.fontSize = '0.85rem';
                label.style.cursor = 'pointer';
                
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.value = sym;
                // Inherit existing if active, otherwise check all default
                if (isSessionActive && globalSessionSymbols.length > 0) {
                    cb.checked = globalSessionSymbols.includes(sym);
                } else {
                    cb.checked = true;
                }
                
                label.appendChild(cb);
                label.appendChild(document.createTextNode(sym));
                container.appendChild(label);
            });

            document.getElementById('session-modal').style.display = 'flex';
        }

        function closeSessionModal() {
            document.getElementById('session-modal').style.display = 'none';
        }

        async function submitSession() {
            const tp = parseFloat(document.getElementById('inp-tp').value);
            const sl = parseFloat(document.getElementById('inp-sl').value);
            const maxSym = parseInt(document.getElementById('inp-max-sym').value);
            
            const checkboxes = document.querySelectorAll('#sym-checkboxes input[type="checkbox"]:checked');
            const selectedSymbols = Array.from(checkboxes).map(cb => cb.value);

            if (isNaN(tp) || isNaN(sl) || isNaN(maxSym) || tp <= 0 || sl <= 0 || maxSym <= 0) {
                alert("Please enter valid positive numbers for TP, SL, and Max Pairs.");
                return;
            }
            if (selectedSymbols.length === 0) {
                alert("Please select at least one trading pair!");
                return;
            }

            closeSessionModal();
            try {
                await fetch('/api/session/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tp: tp, sl: sl, max_symbols: maxSym, symbols: selectedSymbols })
                });
                fetchSignals();
            } catch (e) {
                console.error(e);
            }
        }

        async function endSession() {
            if (!confirm("Are you sure you want to end the current session targets? Trades will remain open.")) return;
            try {
                await fetch('/api/session/stop', { method: 'POST' });
                fetchSignals();
            } catch (e) {
                console.error(e);
            }
        }

        // Fetch immediately and then every 1 second
        fetchSignals();
        setInterval(fetchSignals, 1000);
    </script>
</body>
</html>
