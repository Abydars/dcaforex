<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCA Signal Monitor</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --green: #10b981;
            --red: #ef4444;
            --orange: #f59e0b;
            --gray: #64748b;
        }

        body {
            margin: 0;
            padding: 2rem;
            background: var(--bg-color);
            background-image: radial-gradient(circle at 15% 50%, rgba(99, 102, 241, 0.15), transparent 25%),
                              radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.15), transparent 25%);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 2rem;
            background: linear-gradient(to right, #60a5fa, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1.5rem;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 4px;
            background: var(--gray);
            border-radius: 4px 4px 0 0;
            transition: background-color 0.3s ease;
        }

        .card[data-color="green"]::before { background: var(--green); }
        .card[data-color="red"]::before { background: var(--red); }
        .card[data-color="orange"]::before { background: var(--orange); }

        .symbol-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0 0 0.5rem 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .time {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .status {
            font-size: 1rem;
            line-height: 1.5;
            color: var(--text-secondary);
            min-height: 3rem;
            display: flex;
            align-items: center;
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
            background: rgba(100, 116, 139, 0.2);
            color: var(--gray);
        }

        .card[data-color="green"] .badge { background: rgba(16, 185, 129, 0.2); color: var(--green); }
        .card[data-color="red"] .badge { background: rgba(239, 68, 68, 0.2); color: var(--red); }
        .card[data-color="orange"] .badge { background: rgba(245, 158, 11, 0.2); color: var(--orange); }

        /* Smooth pulse animation for active scanning */
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
        .scanning { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
<body>

    <h1>DCA Market Scanner</h1>
    
    <div class="grid" id="dashboard">
        <!-- Cards will be injected here -->
    </div>

    <script>
        async function fetchSignals() {
            try {
                const res = await fetch('/api/signals');
                const data = await res.json();
                renderDashboard(data);
            } catch (err) {
                console.error("Failed to fetch signals", err);
            }
        }

        function renderDashboard(data) {
            const grid = document.getElementById('dashboard');
            
            const symbols = Object.keys(data).sort();
            if (symbols.length === 0) {
                grid.innerHTML = '<div style="text-align: center; grid-column: 1/-1; color: #64748b;">Waiting for signal engine...</div>';
                return;
            }

            // We update DOM efficiently to avoid flickering
            symbols.forEach(sym => {
                const info = data[sym];
                let stateLabel = "Scanning";
                if (info.color === "green") stateLabel = "Signal Triggered";
                if (info.color === "red") stateLabel = "Blocked";
                if (info.color === "orange") stateLabel = "Delayed";

                let card = document.getElementById('card-' + sym);
                
                if (!card) {
                    card = document.createElement('div');
                    card.id = 'card-' + sym;
                    card.className = 'card';
                    grid.appendChild(card);
                }

                card.setAttribute('data-color', info.color);
                
                card.innerHTML = `
                    <div class="symbol-name">
                        ${sym}
                        <span class="time">${info.time || ''}</span>
                    </div>
                    <div class="badge ${info.color === 'gray' ? 'scanning' : ''}">${stateLabel}</div>
                    <div class="status">${info.status}</div>
                `;
            });
        }

        // Fetch immediately and then every 1 second
        fetchSignals();
        setInterval(fetchSignals, 1000);
    </script>
</body>
</html>
