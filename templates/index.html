<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XAUUSD Premium Scalper</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050505;
            --bg-gradient: radial-gradient(circle at top right, #111827 0%, #050505 60%);
            --panel-bg: rgba(17, 24, 39, 0.4);
            --panel-border: rgba(255, 255, 255, 0.05);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-amber: #f59e0b;
            --glass-blur: blur(12px);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 1.5rem;
            background: var(--bg-dark);
            background-image: var(--bg-gradient);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .app-layout {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 1.5rem;
            align-items: start;
            animation: fadeIn 0.5s ease-out;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            position: sticky;
            top: 1.5rem;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            min-width: 0; /* Prevents overflow in CSS grid */
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Glassmorphic Panels */
        .panel {
            background: var(--panel-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 1.25rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            transition: box-shadow 0.2s;
        }
        
        .panel:hover {
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }

        .panel-header {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }

        /* Typography Colors */
        .text-green { color: var(--accent-green); text-shadow: 0 0 10px rgba(16, 185, 129, 0.3); }
        .text-red { color: var(--accent-red); text-shadow: 0 0 10px rgba(239, 68, 68, 0.3); }
        .text-amber { color: var(--accent-amber); }
        .text-cyan { color: var(--accent-cyan); text-shadow: 0 0 10px rgba(6, 182, 212, 0.3); }
        .text-gray { color: var(--text-muted); }

        /* Header specifics */
        .brand-header {
            padding: 1.5rem;
            background: linear-gradient(135deg, rgba(17, 24, 39, 0.8) 0%, rgba(0, 0, 0, 0.6) 100%);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            backdrop-filter: var(--glass-blur);
        }
        
        .brand-header h1 {
            margin: 0 0 0.5rem 0;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(to right, #fff, #9ca3af);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .account-badge {
            display: inline-block;
            background: rgba(6, 182, 212, 0.1);
            color: var(--accent-cyan);
            border: 1px solid rgba(6, 182, 212, 0.2);
            padding: 0.4rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-family: 'JetBrains Mono', monospace;
            margin-bottom: 1.25rem;
        }

        /* Buttons */
        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 0.6rem 1rem;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
            width: 100%;
            display: block;
            text-align: center;
        }
        
        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-1px);
        }

        .bot-toggle {
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 0.9rem;
            padding: 0.75rem;
        }

        .bot-toggle.on {
            background: rgba(16, 185, 129, 0.1);
            color: var(--accent-green);
            border-color: rgba(16, 185, 129, 0.4);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.15);
        }
        .bot-toggle.off {
            background: rgba(239, 68, 68, 0.1);
            color: var(--accent-red);
            border-color: rgba(239, 68, 68, 0.4);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.1);
            color: var(--accent-red);
            border: 1px solid rgba(239, 68, 68, 0.3);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .btn-danger:hover {
            background: var(--accent-red);
            color: white;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
        }

        /* Grids */
        .grid { display: grid; gap: 0.75rem; }
        .grid-2 { grid-template-columns: repeat(2, 1fr); }
        .grid-3 { grid-template-columns: repeat(3, 1fr); }
        .grid-4 { grid-template-columns: repeat(4, 1fr); }
        .grid-6 { grid-template-columns: repeat(6, 1fr); }

        @media (max-width: 1024px) {
            .app-layout { grid-template-columns: 1fr; }
            .sidebar { position: static; }
        }
        @media (max-width: 768px) {
            .grid-6, .grid-4 { grid-template-columns: repeat(2, 1fr); }
        }

        /* Stat Boxes */
        .stat-box {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            padding: 0.75rem;
            text-align: center;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .stat-box:hover {
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .stat-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.25rem;
        }

        .stat-value {
            font-size: 1.15rem;
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
        }

        /* Sidebar Stat Boxes (Compact) */
        .sidebar .stat-box {
            padding: 0.6rem;
        }
        .sidebar .grid { gap: 0.5rem; }
        .sidebar .stat-value { font-size: 1rem; }

        /* Banners */
        .banner {
            background: rgba(239, 68, 68, 0.1);
            border-left: 4px solid var(--accent-red);
            color: var(--accent-red);
            padding: 0.75rem 1rem;
            border-radius: 6px;
            font-weight: 500;
            font-size: 0.85rem;
            display: none;
            backdrop-filter: blur(4px);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        /* Tables */
        .table-container {
            overflow-x: auto;
            margin: 0 -0.5rem;
        }
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 0.8rem;
        }
        th, td {
            padding: 0.75rem 1rem;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            white-space: nowrap;
        }
        th {
            color: var(--text-muted);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 0.7rem;
        }
        tr:last-child td { border-bottom: none; }
        tbody tr { transition: background 0.1s; }
        tbody tr:hover { background: rgba(255,255,255,0.02); }

        /* Modals */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal {
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 2rem;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            animation: modalPop 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes modalPop {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal h3 {
            margin: 0 0 1.5rem 0;
            color: #fff;
            font-weight: 600;
            font-size: 1.1rem;
        }
        .form-group {
            margin-bottom: 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .form-group label {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
        }
        .form-group input, .form-group select {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            width: 140px;
            text-align: right;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--accent-cyan);
        }
        .btn-modal {
            background: linear-gradient(135deg, var(--accent-cyan), #0284c7);
            color: white;
            border: none;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 1rem;
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.3);
            transition: all 0.2s;
        }
        .btn-modal:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(6, 182, 212, 0.4); }
    </style>
</head>
<body>

<div class="app-layout">
    
    <!-- LEFT SIDEBAR -->
    <div class="sidebar">
        <!-- Brand & Actions -->
        <div class="brand-header">
            <h1>XAUUSD SMC</h1>
            <div class="account-badge" id="account-info">Syncing with MT5...</div>
            
            <div class="grid grid-2" style="margin-bottom: 0.75rem;">
                <button class="btn" onclick="openMt5Modal()">MT5 Link</button>
                <button class="btn" onclick="openConfigModal()">Parameters</button>
            </div>
            <button id="bot-toggle" class="btn bot-toggle on" onclick="toggleBot()">SYSTEM ON</button>
        </div>

        <!-- Today's Performance -->
        <div class="panel">
            <div class="panel-header">Daily Performance</div>
            <div class="grid grid-2" id="today-stats-content">
                <!-- Injected -->
            </div>
        </div>

        <!-- System Rules (Config) -->
        <div class="panel">
            <div class="panel-header">System Rules</div>
            <div class="grid grid-2" id="config-content">
                <!-- Injected -->
            </div>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <!-- BANNER -->
        <div id="daily-stop-banner" class="banner"></div>

        <!-- ACTIVE POSITION -->
        <div class="panel">
            <div class="panel-header">Active Exposure</div>
            <div id="position-content">
                <div style="text-align: center; color: var(--text-muted); padding: 2.5rem 0; font-style: italic;">
                    Seeking high-probability setups...
                </div>
            </div>
        </div>

        <!-- MARKET CONTEXT -->
        <div class="panel">
            <div class="panel-header">Market Context</div>
            <div class="grid grid-4" id="market-context-content">
                <div class="stat-box">
                    <div class="stat-label">H1 Bias</div>
                    <div class="stat-value mono" id="ctx-bias">--</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Structure</div>
                    <div class="stat-value mono" id="ctx-zone">--</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Session</div>
                    <div class="stat-value mono" id="ctx-filters">--</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Live Quote</div>
                    <div class="stat-value mono text-cyan" id="ctx-price">--</div>
                </div>
            </div>
        </div>

        <!-- TRADE HISTORY -->
        <div class="panel">
            <div class="panel-header">
                Trade Ledger
                <span id="history-summary" style="font-size: 0.7rem; color: var(--accent-cyan); font-family: 'JetBrains Mono', monospace; letter-spacing: 0;"></span>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Timestamp</th>
                            <th>Type</th>
                            <th>Entry</th>
                            <th>Exit</th>
                            <th>P/L</th>
                            <th>Note</th>
                        </tr>
                    </thead>
                    <tbody id="history-table">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<!-- MT5 MODAL -->
<div class="modal-overlay" id="mt5-modal" onclick="if(event.target===this) closeMt5Modal()">
    <div class="modal">
        <h3>Broker Connection</h3>
        <div class="form-group"><label>Account ID</label><input type="text" id="mt5_login"></div>
        <div class="form-group"><label>Password</label><input type="password" id="mt5_pass" placeholder="Unchanged"></div>
        <div class="form-group"><label>Server</label><input type="text" id="mt5_server"></div>
        <button class="btn-modal" onclick="saveMt5Config()" id="btn-mt5-save">Initialize MT5</button>
    </div>
</div>

<!-- CONFIG MODAL -->
<div class="modal-overlay" id="config-modal" onclick="if(event.target===this) closeConfigModal()">
    <div class="modal">
        <h3>Risk & Logic Parameters</h3>
        <div class="form-group"><label>Risk Per Trade (%)</label><input type="number" step="0.1" id="cfg_RISK_PCT_PER_TRADE"></div>
        <div class="form-group"><label>Max Daily Loss (%)</label><input type="number" step="0.1" id="cfg_MAX_DAILY_LOSS_PCT"></div>
        <div class="form-group"><label>Trade Limit / Day</label><input type="number" step="1" id="cfg_MAX_TRADES_PER_DAY"></div>
        <div class="form-group"><label>Consecutive Stops</label><input type="number" step="1" id="cfg_MAX_CONSECUTIVE_LOSSES"></div>
        <div class="form-group"><label>Minimum RR</label><input type="number" step="0.1" id="cfg_MIN_RR"></div>
        <div class="form-group"><label>Maximum RR</label><input type="number" step="0.1" id="cfg_MAX_RR"></div>
        <div class="form-group"><label>Min ATR Volatility</label><input type="number" step="0.1" id="cfg_MIN_ATR_M15_USD"></div>
        <div class="form-group"><label>Spread Ceiling ($)</label><input type="number" step="0.1" id="cfg_MAX_SPREAD_USD"></div>
        <div class="form-group">
            <label>High Impact News</label>
            <select id="cfg_NEWS_ENABLED">
                <option value="true">AVOID</option>
                <option value="false">TRADE</option>
            </select>
        </div>
        <button class="btn-modal" onclick="saveConfig()">Apply to Engine</button>
    </div>
</div>

<script>
    let isBotEnabled = true;

    async function fetchData() {
        try {
            const res = await fetch('/api/state');
            if (res.status === 401) { window.location.href = '/login'; return; }
            const data = await res.json();
            renderState(data);
        } catch (e) { console.error(e); }
    }

    async function fetchHistory() {
        try {
            const res = await fetch('/api/history?days=30');
            if (res.status === 401) return;
            const data = await res.json();
            renderHistory(data);
        } catch (e) { console.error(e); }
    }

    function renderState(data) {
        // Toggle
        isBotEnabled = data.bot_enabled;
        const btn = document.getElementById('bot-toggle');
        if (isBotEnabled) {
            btn.className = 'btn bot-toggle on';
            btn.innerText = 'SYSTEM ACTIVE';
        } else {
            btn.className = 'btn bot-toggle off';
            btn.innerText = 'SYSTEM HALTED';
        }

        // Account
        if (data.account && data.account.login) {
            document.getElementById('account-info').innerText = 
                `${data.account.server} | Acc: ${data.account.login} | Eq: $${data.account.equity.toFixed(2)}`;
        }

        // Config Grid
        if (data.config) {
            const cfg = data.config;
            document.getElementById('config-content').innerHTML = `
                <div class="stat-box"><div class="stat-label">Risk</div><div class="stat-value text-cyan">${cfg.RISK_PCT_PER_TRADE}%</div></div>
                <div class="stat-box"><div class="stat-label">Daily DD Cap</div><div class="stat-value">${cfg.MAX_DAILY_LOSS_PCT}%</div></div>
                <div class="stat-box"><div class="stat-label">Max Trades</div><div class="stat-value">${cfg.MAX_TRADES_PER_DAY}</div></div>
                <div class="stat-box"><div class="stat-label">Consec Stops</div><div class="stat-value">${cfg.MAX_CONSECUTIVE_LOSSES}</div></div>
                <div class="stat-box"><div class="stat-label">Min Reward</div><div class="stat-value">${cfg.MIN_RR}R</div></div>
                <div class="stat-box"><div class="stat-label">News Rule</div><div class="stat-value">${cfg.NEWS_ENABLED ? '<span class="text-green">AVOID</span>' : '<span class="text-red">TRADE</span>'}</div></div>
            `;
            
            if (document.getElementById('config-modal').style.display !== 'flex') {
                document.getElementById('cfg_RISK_PCT_PER_TRADE').value = cfg.RISK_PCT_PER_TRADE;
                document.getElementById('cfg_MAX_DAILY_LOSS_PCT').value = cfg.MAX_DAILY_LOSS_PCT;
                document.getElementById('cfg_MAX_TRADES_PER_DAY').value = cfg.MAX_TRADES_PER_DAY;
                document.getElementById('cfg_MAX_CONSECUTIVE_LOSSES').value = cfg.MAX_CONSECUTIVE_LOSSES;
                document.getElementById('cfg_MIN_RR').value = cfg.MIN_RR;
                document.getElementById('cfg_MAX_RR').value = cfg.MAX_RR;
                document.getElementById('cfg_MIN_ATR_M15_USD').value = cfg.MIN_ATR_M15_USD;
                document.getElementById('cfg_MAX_SPREAD_USD').value = cfg.MAX_SPREAD_USD;
                document.getElementById('cfg_NEWS_ENABLED').value = cfg.NEWS_ENABLED ? "true" : "false";
            }
        }

        // Banner
        const banner = document.getElementById('daily-stop-banner');
        if (data.today_stats && data.today_stats.stopped_by_limit) {
            banner.style.display = 'block';
            banner.innerText = `LOCKED: ${data.today_stats.reason}`;
        } else {
            banner.style.display = 'none';
        }

        // Position
        const posDiv = document.getElementById('position-content');
        if (data.position) {
            const p = data.position;
            const isProfit = p.pnl >= 0;
            const pnlColor = isProfit ? 'text-green' : 'text-red';
            const sign = isProfit ? '+' : '';
            
            let tpDist = Math.abs(p.tp - p.entry_price);
            let slDist = Math.abs(p.entry_price - p.sl);
            let tpPct = 0, slPct = 0;
            
            if (p.direction === 'BUY') {
                if (p.current_price > p.entry_price) tpPct = ((p.current_price - p.entry_price) / tpDist) * 100;
                else slPct = ((p.entry_price - p.current_price) / slDist) * 100;
            } else {
                if (p.current_price < p.entry_price) tpPct = ((p.entry_price - p.current_price) / tpDist) * 100;
                else slPct = ((p.current_price - p.entry_price) / slDist) * 100;
            }
            tpPct = Math.max(0, Math.min(100, tpPct)).toFixed(1);
            slPct = Math.max(0, Math.min(100, slPct)).toFixed(1);

            posDiv.innerHTML = `
                <div class="grid grid-6">
                    <div class="stat-box"><div class="stat-label">Direction</div><div class="stat-value text-${p.direction === 'BUY' ? 'green' : 'red'}">${p.direction}</div></div>
                    <div class="stat-box"><div class="stat-label">Net P/L</div><div class="stat-value mono ${pnlColor}">${sign}$${p.pnl.toFixed(2)}</div></div>
                    <div class="stat-box"><div class="stat-label">Entry</div><div class="stat-value mono">${p.entry_price.toFixed(2)}</div></div>
                    <div class="stat-box"><div class="stat-label">Current</div><div class="stat-value mono">${p.current_price.toFixed(2)}</div></div>
                    <div class="stat-box"><div class="stat-label">Target</div><div class="stat-value mono text-green">${p.tp.toFixed(2)} <span style="font-size:0.6rem">(${tpPct}%)</span></div></div>
                    <div class="stat-box"><div class="stat-label">Stop</div><div class="stat-value mono text-red">${p.sl.toFixed(2)} <span style="font-size:0.6rem">(${slPct}%)</span></div></div>
                </div>
                <button class="btn btn-danger" style="margin-top: 1rem;" onclick="emergencyClose()">Force Liquidation</button>
            `;
        } else {
            posDiv.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 2.5rem 0; font-style: italic;">No active exposure. Seeking setups...</div>`;
        }

        // Today's Stats
        if (data.today_stats) {
            const ts = data.today_stats;
            const pnlColor = ts.realized_pnl >= 0 ? 'text-green' : 'text-red';
            document.getElementById('today-stats-content').innerHTML = `
                <div class="stat-box" style="grid-column: span 2;"><div class="stat-label">Net Return</div><div class="stat-value mono ${pnlColor}">$${ts.realized_pnl.toFixed(2)}</div></div>
                <div class="stat-box"><div class="stat-label">Executions</div><div class="stat-value">${ts.trades_today}</div></div>
                <div class="stat-box"><div class="stat-label">Win/Loss</div><div class="stat-value"><span class="text-green">${ts.wins}</span> - <span class="text-red">${ts.losses}</span></div></div>
            `;
        }
    }

    function renderHistory(data) {
        if (data.summary) {
            document.getElementById('history-summary').innerText = `[VOL: ${data.summary.total_trades} | WR: ${data.summary.winrate.toFixed(1)}% | NET: $${data.summary.total_pnl.toFixed(2)}]`;
        }
        
        const tbody = document.getElementById('history-table');
        if (!data.recent_trades || data.recent_trades.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color: var(--text-muted);">Ledger empty</td></tr>';
            return;
        }

        tbody.innerHTML = data.recent_trades.map(t => {
            const d = new Date(t.exit_time * 1000);
            const timeStr = d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            const dirColor = t.direction === 'BUY' ? 'text-green' : 'text-red';
            const pnlColor = t.pnl >= 0 ? 'text-green' : 'text-red';
            const sign = t.pnl >= 0 ? '+' : '';
            return `
                <tr>
                    <td class="mono text-gray">${timeStr}</td>
                    <td class="mono ${dirColor}">${t.direction}</td>
                    <td class="mono">${t.entry_price.toFixed(2)}</td>
                    <td class="mono">${t.exit_price.toFixed(2)}</td>
                    <td class="mono ${pnlColor}">${sign}$${t.pnl.toFixed(2)}</td>
                    <td style="color:var(--text-muted); font-size: 0.7rem">${t.exit_reason}</td>
                </tr>
            `;
        }).join('');
    }

    async function toggleBot() {
        if (!confirm(`Switch system ${!isBotEnabled ? 'ON' : 'OFF'}?`)) return;
        try {
            await fetch('/api/toggle', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({enabled: !isBotEnabled}) });
            fetchData();
        } catch (e) { console.error(e); }
    }

    async function emergencyClose() {
        if (!confirm('🚨 CRITICAL: Force liquidation of open position at market price?')) return;
        try {
            await fetch('/api/close', { method: 'POST' });
            alert("Signal sent to execution engine.");
        } catch (e) { console.error(e); }
    }

    function openMt5Modal() { document.getElementById('mt5-modal').style.display = 'flex'; }
    function closeMt5Modal() { document.getElementById('mt5-modal').style.display = 'none'; }
    function openConfigModal() { document.getElementById('config-modal').style.display = 'flex'; }
    function closeConfigModal() { document.getElementById('config-modal').style.display = 'none'; }

    async function saveMt5Config() {
        const btn = document.getElementById('btn-mt5-save');
        btn.innerText = 'Connecting...'; btn.disabled = true;
        try {
            const res = await fetch('/api/mt5_config', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    MT5_LOGIN: document.getElementById('mt5_login').value,
                    MT5_PASS: document.getElementById('mt5_pass').value,
                    MT5_SERVER: document.getElementById('mt5_server').value
                })
            });
            const data = await res.json();
            if (data.success) { alert("Connected!"); closeMt5Modal(); fetchData(); }
            else { alert("Error: " + data.error); }
        } catch(e) { alert("Network error"); }
        finally { btn.innerText = 'Initialize MT5'; btn.disabled = false; }
    }

    async function saveConfig() {
        try {
            await fetch('/api/config', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    RISK_PCT_PER_TRADE: document.getElementById('cfg_RISK_PCT_PER_TRADE').value,
                    MAX_DAILY_LOSS_PCT: document.getElementById('cfg_MAX_DAILY_LOSS_PCT').value,
                    MAX_TRADES_PER_DAY: document.getElementById('cfg_MAX_TRADES_PER_DAY').value,
                    MAX_CONSECUTIVE_LOSSES: document.getElementById('cfg_MAX_CONSECUTIVE_LOSSES').value,
                    MIN_RR: document.getElementById('cfg_MIN_RR').value,
                    MAX_RR: document.getElementById('cfg_MAX_RR').value,
                    MIN_ATR_M15_USD: document.getElementById('cfg_MIN_ATR_M15_USD').value,
                    MAX_SPREAD_USD: document.getElementById('cfg_MAX_SPREAD_USD').value,
                    NEWS_ENABLED: document.getElementById('cfg_NEWS_ENABLED').value
                })
            });
            closeConfigModal(); fetchData();
        } catch(e) { console.error(e); }
    }

    fetchData(); fetchHistory();
    setInterval(fetchData, 2000);
    setInterval(fetchHistory, 60000);
</script>
</body>
</html>
